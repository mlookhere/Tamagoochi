version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type:maintenance
      - risk:dependencies
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type:maintenance
      - risk:dependencies
      - risk:ci
      - risk:deployment
  - package-ecosystem: pip
    directory: /ci
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - type:maintenance
      - risk:dependencies
      - risk:ci
