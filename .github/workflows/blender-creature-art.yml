name: Tamagoochi Blender creature art

on:
  workflow_dispatch:
    inputs:
      species:
        description: Original creature to generate and review
        required: true
        type: choice
        default: puffino
        options: [puffino, lunari, sproutle, bubblin, all]
      quality:
        description: Quick render or higher-resolution full evidence
        required: true
        type: choice
        default: smoke
        options: [smoke, review]
  # Run all-species CPU smoke on reviewed workflow-branch updates; no untrusted PR trigger.
  push:
    branches: [work/37-blender-render-pipeline]
    paths: [.github/workflows/blender-creature-art.yml]

permissions:
  contents: read

concurrency:
  group: blender-creatures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blender-prototype:
    name: Generate and review real Blender models
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # Reviewed public commit ID; grouped to avoid false-positive secret scans.
      ART_SOURCE_SHA_GROUPED: 6decc3d9-9af3e08c-42b5828b-6499e006-4e335e5e
    steps:
      - name: Resolve reviewed art commit
        id: approved_art
        shell: bash
        run: |
          set -euo pipefail
          sha="${ART_SOURCE_SHA_GROUPED//-/}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Reviewed art source commit has an invalid SHA" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout asset source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.approved_art.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches reviewed art commit
        env:
          EXPECTED_ART_SHA: ${{ steps.approved_art.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_ART_SHA" ]]; then
            echo "Art checkout differs from approved source revision" >&2
            exit 1
          fi

      - name: Require all art-generator and validation source files
        shell: bash
        run: |
          set -euo pipefail
          for file in make_puffino_sculpt.py render_quality_review.py sculpt_details.py validate_glb.py test_validate_glb.py; do
            test -s "unity/Assets/TamagoochiArt/DCC/$file"
          done

      - name: Install verified official Blender 4.5.14 LTS
        shell: bash
        run: |
          set -euo pipefail
          release="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.14-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/blender-4.5.14.sha256" -o "$RUNNER_TEMP/blender-4.5.14.sha256"
          curl --fail --silent --show-error --location --retry 3 \
            "$release/$archive" -o "$RUNNER_TEMP/$archive"
          grep -F " $archive" "$RUNNER_TEMP/blender-4.5.14.sha256" > "$RUNNER_TEMP/selected.sha256"
          test -s "$RUNNER_TEMP/selected.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check selected.sha256)
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.14-linux-x64" >> "$GITHUB_PATH"

      - name: Confirm Blender binary
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1 --python-expr 'import bpy; assert bpy.app.version[:2] == (4, 5); print("BLENDER_OK", bpy.app.version_string)'

      - name: Check GLB validator regression cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s unity/Assets/TamagoochiArt/DCC -p 'test_validate_glb.py' -v

      - name: Generate meshes and render actual model proof
        shell: bash
        env:
          ART_SPECIES: ${{ github.event_name == 'workflow_dispatch' && inputs.species || 'all' }}
          ART_QUALITY: ${{ github.event_name == 'workflow_dispatch' && inputs.quality || 'smoke' }}
        run: |
          set -euo pipefail
          case "$ART_SPECIES" in
            puffino|lunari|sproutle|bubblin) species=("$ART_SPECIES") ;;
            all) species=(puffino lunari sproutle bubblin) ;;
            *) echo "Unsupported species" >&2; exit 1 ;;
          esac
          case "$ART_QUALITY" in
            smoke) resolution=512; samples=8 ;;
            review) resolution=960; samples=32 ;;
            *) echo "Unsupported render quality" >&2; exit 1 ;;
          esac
          mkdir -p artifacts/blender/models artifacts/blender/proof
          git rev-parse HEAD > artifacts/blender/source-commit.txt
          script=unity/Assets/TamagoochiArt/DCC/make_puffino_sculpt.py
          for creature in "${species[@]}"; do
            blender --background --factory-startup --python-exit-code 1 \
              --python "$script" -- --output "$PWD/artifacts/blender/models" \
              --species "$creature" --profile sculpt
            blender --background --factory-startup --python-exit-code 1 \
              --python "$script" -- --output "$PWD/artifacts/blender/models" \
              --species "$creature" --profile mobile
            python3 unity/Assets/TamagoochiArt/DCC/validate_glb.py \
              "artifacts/blender/models/${creature}_sculpt.glb" \
              "artifacts/blender/models/${creature}_mobile.glb"
          done
          blender --background --factory-startup --python-exit-code 1 \
            --python unity/Assets/TamagoochiArt/DCC/render_quality_review.py -- \
            --output "$PWD/artifacts/blender/proof" --species "$ART_SPECIES" \
            --engine cycles --samples "$samples" --resolution "$resolution"
          test -s artifacts/blender/proof/quality_report.json
          printf '## Tamagoochi model proofs\n\n- Species: %s\n- Quality: %s\n- Art source: %s\n\nCreative approval is still required.\n' \
            "$ART_SPECIES" "$ART_QUALITY" "$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete native art evidence before upload
        shell: bash
        env:
          ART_SPECIES: ${{ github.event_name == 'workflow_dispatch' && inputs.species || 'all' }}
          EXPECTED_ART_SHA: ${{ steps.approved_art.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/blender")
          report = json.loads((root / "proof/quality_report.json").read_text())
          species = ("puffino", "lunari", "sproutle", "bubblin")
          requested = species if os.environ["ART_SPECIES"] == "all" else (os.environ["ART_SPECIES"],)
          if not set(requested) <= set(species):
              raise SystemExit("Unexpected species in native art evidence")
          if (report.get("schema") != 1 or report.get("technical_checks_pass") is not True
                  or report.get("creative_review") != "required"
                  or report.get("production_ready") is not False
                  or {row.get("species") for row in report.get("species", [])} != set(requested)
                  or len(report.get("species", [])) != len(requested)):
              raise SystemExit("Native art report is incomplete or claims unapproved production status")
          if (root / "source-commit.txt").read_text().strip() != os.environ["EXPECTED_ART_SHA"]:
              raise SystemExit("Art evidence does not match the approved source commit")
          expected_proofs = {"front", "three_quarter", "side", "back",
                             "face_Smile", "face_Pout", "face_Curious", "phone_256"}
          for row in report["species"]:
              name = row["species"]
              if set(row.get("proof_images", {})) != expected_proofs or row.get("mechanical_pass") is not True:
                  raise SystemExit(f"Missing native proof angles or failed mechanical QA: {name}")
              for key, recorded_size in row["proof_images"].items():
                  path = root / "proof" / f"{name}_{key.lower() if key.startswith('face_') else key}.png"
                  # Expression files are named face_smile/face_pout/face_curious.
                  if not path.is_file() or path.stat().st_size != recorded_size:
                      raise SystemExit(f"Missing or mismatched native proof: {path}")
                  with path.open("rb") as source:
                      if source.read(8) != bytes((137, 80, 78, 71, 13, 10, 26, 10)):
                          raise SystemExit(f"Invalid PNG proof: {path}")
              for profile in ("sculpt", "mobile"):
                  for ext, magic in (("blend", b"BLENDER"), ("glb", b"glTF")):
                      path = root / "models" / f"{name}_{profile}.{ext}"
                      if not path.is_file() or path.stat().st_size < 64:
                          raise SystemExit(f"Missing native model: {path}")
                      with path.open("rb") as model:
                          if model.read(len(magic)) != magic:
                              raise SystemExit(f"Invalid native model format: {path}")
          print("All requested native models and eight PNG proofs per species validated")
          PY

      - name: Upload model source, exported geometry, textures and proof renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blender-creatures-${{ github.run_id }}
          path: artifacts/blender/
          if-no-files-found: warn
          retention-days: 14
