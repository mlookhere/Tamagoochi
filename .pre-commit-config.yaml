minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: chatfreept-quality-staged
        name: Deterministic staged-file gates
        entry: ./ci/run quality-staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: chatfreept-workflow-policy
        name: GitHub workflow and policy checks
        entry: ./scripts/validate-workflow
        language: system
        pass_filenames: false
        files: ^(?:\.chatfreept/|\.github/workflows/|workflow/|ci/|scripts/)
        stages: [pre-commit]

      - id: chatfreept-fast-pre-push
        name: Fast pre-push gates
        entry: ./ci/run fast
        language: system
        pass_filenames: false
        stages: [pre-push]
